<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VICE TIDE Cover Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>VICE TIDE <span>Cover Studio</span></h1>
  <p class="tagline">Photo + caption &rarr; GTA 6-style cover art</p>
</header>
<main class="layout">
  <section class="col controls">
    <h2>Photo</h2>
    <div id="photo-picker" class="picker"></div>
    <label class="upload">Upload a photo
      <input id="photo-upload" type="file" accept="image/*">
    </label>
    <h2>Layout</h2>
    <div id="layout-picker" class="picker"></div>
    <h2>Grade</h2>
    <div id="grade-picker" class="picker"></div>
    <h2>Strength</h2>
    <input id="strength-input" type="range" min="0" max="1" step="0.05" value="1">
    <span id="strength-value">100%</span>
  </section>
  <section class="col preview-col">
    <canvas id="preview"></canvas>
    <p id="size-label" class="size-label">1080 &times; 1080</p>
  </section>
  <section class="col controls">
    <h2>Caption</h2>
    <label>Title
      <input id="title-input" type="text" value="VICE TIDE" maxlength="24">
    </label>
    <label>Script line
      <input id="script-input" type="text" value="Saltwater Nights" maxlength="32">
    </label>
    <label>Quote
      <input id="quote-input" type="text" value="Every sunset is a getaway." maxlength="64">
    </label>
    <h2>Export size</h2>
    <div id="size-picker" class="picker"></div>
    <button id="export-btn" type="button">Export PNG</button>
  </section>
</main>
<script type="module" src="src/shots.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
